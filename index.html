<!doctype html>
<html lang="he" dir="rtl">
<head>

    <div class="tabs-inner" role="tablist">
      <button class="tab" role="tab" data-tab="list" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/></svg>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h14v18l-2.5-1.5L14 21l-2-1.5L10 21l-2.5-1.5L5 21z"/><path d="M9 8h6M9 12h6"/></svg>

        מוצרים

        משפחה
      </button>
    </div>
  </nav>

  <datalist id="productNames"></datalist>

  <script src="js/parser.js?v=22"></script>
  <script src="js/categories.js?v=22"></script>

      navigator.serviceWorker.register('sw.js').catch(() => {});
