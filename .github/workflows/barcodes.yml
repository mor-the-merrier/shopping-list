# Weekly: rebuild data/barcodes.json (barcode -> product name) from the
# supermarkets' public price files. Free on public repositories.
name: Update barcode names

on:
  schedule:
    - cron: "17 2 * * 1" # Mondays, 02:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - scripts/build_barcodes.py
      - .github/workflows/barcodes.yml

permissions:
  contents: write

concurrency:
  group: barcodes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the barcode list
        run: python scripts/build_barcodes.py data

      - name: Save it to the site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update barcode names ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
